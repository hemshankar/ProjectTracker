services:
  mongo:
    image: mongo:7
    container_name: scatterboard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: scatterboard-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: scatterboard
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - integrations

  integrations:
    build: ./integrations-service
    container_name: scatterboard-integrations
    restart: unless-stopped
    env_file:
      - ./integrations-service/.env
    volumes:
      - ./integrations-service/app:/srv/app
    # Docker network (http://integrations:8100) plus localhost for debugging.
    # Only POST /webhooks/composio must be publicly reachable (tunnel in dev, e.g. ngrok -> integrations:8100).
    # Never publish /admin beyond the machine without TLS and an authenticating proxy.
    expose:
      - "8100"
    ports:
      - "127.0.0.1:8100:8100"

  integrations-admin:
    build: ./integrations-admin
    container_name: scatterboard-integrations-admin
    restart: unless-stopped
    # Localhost only. Never publish this beyond the machine without a VPN/authenticating proxy.
    ports:
      - "127.0.0.1:8101:80"
    depends_on:
      - integrations

  accounting:
    build: ./accounting-service
    container_name: scatterboard-accounting
    restart: unless-stopped
    env_file:
      - ./accounting-service/.env
    environment:
      MONGO_URI: mongodb://mongo:27017        # point at a dedicated instance in prod
      MONGO_DB_NAME: scatterboard_accounting
    volumes:
      - ./accounting-service/app:/srv/app
    # Internal-only: loopback for debugging, never public.
    expose:
      - "8200"
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: scatterboard-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
