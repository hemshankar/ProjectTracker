server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only ever talks to this origin; /api/* is forwarded to the gateway's /admin/*.
  location /api/ {
    proxy_pass http://integrations:8100/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
